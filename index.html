
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXA PUB — AUTHÊNTICA</title>
<style>
:root{--amarelo:#ffd400;--rodape:58px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#101010;color:white;font-family:Arial,sans-serif}
main{display:flex;height:calc(100dvh - var(--rodape))}
#publicidade{position:relative;width:38%;height:100%;background:#000;overflow:hidden;flex-shrink:0}
#anuncio{position:absolute;inset:0;overflow:hidden;background:#000}
#youtube-player{position:absolute}
#anuncio video{width:100%;height:100%;object-fit:cover}
#mensagem{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:2vw}
#menu{flex:1;min-width:0;padding:1.1vw 1.3vw;overflow:hidden}
h1{color:var(--amarelo);font-size:2.2vw;margin:0 0 10px}
#produtos{height:calc(100% - 55px);overflow:hidden}
.linha{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid #292929;font-size:1.1vw}
.preco{color:var(--amarelo);font-weight:bold;white-space:nowrap}
footer{height:var(--rodape);background:var(--amarelo);color:#000;display:flex;align-items:center;overflow:hidden}
#rodape{white-space:nowrap;display:inline-block;flex-shrink:0;padding-left:100vw;font-size:1.4vw;font-weight:bold;animation:deslizar 35s linear infinite}
@keyframes deslizar{from{transform:translateX(0)}to{transform:translateX(-100%)}}
</style>
</head>
<body>

<main>
<section id="publicidade">
<div id="anuncio"><div id="mensagem">A carregar publicidade...</div></div>
</section>
<section id="menu">
<h1>AUTHÊNTICA — MENU</h1>
<div id="produtos">A carregar produtos...</div>
</section>
</main>
<footer><div id="rodape">Bem-vindo à AUTHÊNTICA</div></footer>

<script>
"use strict";

const API="https://script.google.com/macros/s/AKfycbwijR8z9g_tcbiru_uHKN3BVVxaQocU-lXFI6l9Vvk2JP_rs21EZG0aTakhzka_pIQ/exec";
const texto=v=>String(v??"").trim();

let anuncios=[];
let indice=0;
let assinatura="";
let player=null;
let youtubePronto=false;
let pedido=0;
let geracao=0;
let temporizador=null;

const anuncioEl=document.getElementById("anuncio");
const publicidadeEl=document.getElementById("publicidade");

function formatarPreco(v){
 const n=Number(texto(v).replace(",","."));
 return Number.isFinite(n)
 ?n.toLocaleString("pt-PT",{style:"currency",currency:"EUR"})
 :texto(v);
}

function mostrarProdutos(lista){
 const caixa=document.getElementById("produtos");
 caixa.replaceChildren();
 (Array.isArray(lista)?lista:[]).forEach(p=>{
  if(!texto(p.produto))return;
  const linha=document.createElement("div");
  linha.className="linha";
  const nome=document.createElement("span");
  nome.textContent=p.produto;
  const valor=document.createElement("span");
  valor.className="preco";
  valor.textContent=formatarPreco(p.preco);
  linha.append(nome,valor);
  caixa.append(linha);
 });
}

function mostrarRodape(lista){
 const mensagens=(Array.isArray(lista)?lista:[])
 .slice().sort((a,b)=>Number(a.ordem||0)-Number(b.ordem||0))
 .map(r=>texto(r.texto)).filter(Boolean);
 document.getElementById("rodape").textContent=
 mensagens.join("     •     ")||"Bem-vindo à AUTHÊNTICA";
}

function youtubeId(url){
 try{
  const u=new URL(url);
  const host=u.hostname.toLowerCase();
  if(["youtu.be","www.youtu.be"].includes(host))
   return u.pathname.split("/")[1]||"";
  if(["youtube.com","www.youtube.com","m.youtube.com",
      "youtube-nocookie.com","www.youtube-nocookie.com"].includes(host)){
   if(u.pathname==="/watch")return u.searchParams.get("v")||"";
   const p=u.pathname.split("/");
   if(["embed","shorts","live"].includes(p[1]))return p[2]||"";
  }
 }catch(e){}
 return "";
}

function ajustarYoutube(){
 const iframe=anuncioEl.querySelector("iframe");
 if(!iframe)return;
 const w=publicidadeEl.clientWidth;
 const h=publicidadeEl.clientHeight;
 if(!w||!h)return;
 const largura=Math.max(w,h*16/9);
 const altura=Math.max(h,w*9/16);
 iframe.style.position="absolute";
 iframe.style.width=largura+"px";
 iframe.style.height=altura+"px";
 iframe.style.left="50%";
 iframe.style.top="50%";
 iframe.style.transform="translate(-50%,-50%)";
 iframe.style.border="0";
}

function mostrarMensagem(m){
 anuncioEl.replaceChildren();
 const div=document.createElement("div");
 div.id="mensagem";
 div.textContent=m;
 anuncioEl.append(div);
}

function proximoAnuncio(){
 if(!anuncios.length)return;
 indice=(indice+1)%anuncios.length;
 mostrarAnuncio();
}

function mostrarAnuncio(){
 geracao++;
 const atual=geracao;
 clearTimeout(temporizador);

 if(player){
  const anterior=player;
  player=null;
  try{anterior.destroy()}catch(e){}
 }
 anuncioEl.replaceChildren();

 if(!anuncios.length){
  mostrarMensagem("Sem anúncios ativos");
  return;
 }

 const a=anuncios[indice%anuncios.length];
 const url=texto(a.urlVideo);
 const id=youtubeId(url);

 if(id){
  if(!youtubePronto){
   mostrarMensagem("A carregar vídeo...");
   return;
  }

  const div=document.createElement("div");
  div.id="youtube-player";
  anuncioEl.append(div);

  player=new YT.Player("youtube-player",{
   videoId:id,
   playerVars:{
    autoplay:1,
    mute:1,
    controls:0,
    playsinline:1,
    rel:0,
    fs:0,
    disablekb:1,
    iv_load_policy:3
   },
   events:{
    onReady:function(event){
     if(atual!==geracao)return;
     event.target.mute();
     event.target.playVideo();
     ajustarYoutube();
    },
    onStateChange:function(event){
     if(atual!==geracao)return;
     if(event.data===YT.PlayerState.ENDED){
      proximoAnuncio();
     }
    },
    onError:function(){
     if(atual!==geracao)return;
     proximoAnuncio();
    }
   }
  });
  return;
 }

 if(/^https?:\/\//i.test(url)){
  const video=document.createElement("video");
  video.src=url;
  video.autoplay=true;
  video.muted=true;
  video.playsInline=true;
  video.controls=false;
  video.loop=false;
  video.onended=()=>{
   if(atual===geracao)proximoAnuncio();
  };
  video.onerror=()=>{
   if(atual===geracao)proximoAnuncio();
  };
  anuncioEl.append(video);
  video.play().catch(()=>{});
  return;
 }

 mostrarMensagem(a.nome||"Publicidade");
 temporizador=setTimeout(()=>{
  if(atual===geracao)proximoAnuncio();
 },30000);
}

function mostrarPublicidade(lista){
 const novos=(Array.isArray(lista)?lista:[])
 .filter(a=>texto(a.urlVideo))
 .sort((a,b)=>Number(a.ordem||0)-Number(b.ordem||0));
 const nova=JSON.stringify(novos);
 if(nova!==assinatura){
  assinatura=nova;
  anuncios=novos;
  indice=0;
  mostrarAnuncio();
 }
}

function receber(dados){
 if(!dados)return;
 mostrarProdutos(dados.produtos);
 mostrarRodape(dados.rodape);
 mostrarPublicidade(dados.publicidade);
}

function atualizar(){
 const callback="nexaCallback"+(++pedido);
 const script=document.createElement("script");
 window[callback]=function(dados){
  receber(dados);
  delete window[callback];
  script.remove();
 };
 script.src=API+"?callback="+callback+"&t="+Date.now();
 script.onerror=()=>{
  delete window[callback];
  script.remove();
 };
 document.body.append(script);
}

window.onYouTubeIframeAPIReady=function(){
 youtubePronto=true;
 if(anuncios.length)mostrarAnuncio();
};

const youtubeScript=document.createElement("script");
youtubeScript.src="https://www.youtube.com/iframe_api";
document.head.append(youtubeScript);

window.addEventListener("resize",ajustarYoutube);

atualizar();
setInterval(atualizar,60000);
</script>
</body>
</html>
