
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXA PUB — AUTHÊNTICA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#111;color:#fff;font-family:Arial,sans-serif}
main{height:calc(100vh - 65px);display:flex}
#publicidade{
  width:38%;background:#191919;
  display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:3vw
}
#menu{width:62%;padding:2vw;overflow:hidden}
h1{color:#ffd400;font-size:3vw;margin:0 0 16px}
#produtos{height:calc(100% - 65px);overflow:hidden}
.linha{
  display:flex;justify-content:space-between;gap:15px;
  padding:7px 0;border-bottom:1px solid #333;
  font-size:1.35vw
}
.preco{color:#ffd400;white-space:nowrap;font-weight:bold}
footer{
  height:65px;background:#ffd400;color:#000;
  display:flex;align-items:center;overflow:hidden;
  font-size:25px;font-weight:bold
}
#rodape{
  display:inline-block;white-space:nowrap;
  padding-left:100vw;
  animation:deslizar 35s linear infinite
}
@keyframes deslizar{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}
</style>
</head>
<body>

<main>
  <section id="publicidade">
    NEXA PUB<br>PUBLICIDADE
  </section>

  <section id="menu">
    <h1>AUTHÊNTICA — MENU</h1>
    <div id="produtos">A carregar produtos...</div>
  </section>
</main>

<footer>
  <div id="rodape">Bem-vindo à AUTHÊNTICA</div>
</footer>

<script>
const API = "https://script.google.com/macros/s/AKfycbzg93sm7ajA6bo2nKhDrUzbqtttcYiAMYg2r8EIML8JK0rfuRSlGQzUkBrDqEzeLLzk/exec";

function ativo(valor){
  return ["SIM","TRUE","1","YES"].includes(
    String(valor ?? "").trim().toUpperCase()
  );
}

function texto(valor){
  return String(valor ?? "").trim();
}

function formatarPreco(valor){
  const original=texto(valor);
  if(!original)return "";
  if(original.includes("€"))return original;
  const numero=Number(original.replace(",","."));
  if(!Number.isFinite(numero))return original;
  return numero.toLocaleString("pt-PT",{
    style:"currency",currency:"EUR"
  });
}

function receber(dados){
  // PRODUTOS E PREÇOS
  const produtos=Array.isArray(dados.produtos)
    ? dados.produtos : [];

  const caixa=document.getElementById("produtos");
  caixa.replaceChildren();

  produtos.forEach(p=>{
    const visibilidade=p.mostrar ?? p.mostrarNoMenu
      ?? p["Mostrar no menu?"] ?? "SIM";

    if(!ativo(visibilidade))return;

    const nome=texto(p.produto ?? p.nome ?? p.Produto);
    if(!nome)return;

    const linha=document.createElement("div");
    linha.className="linha";

    const descricao=document.createElement("span");
    descricao.textContent=nome;

    const preco=document.createElement("span");
    preco.className="preco";
    preco.textContent=formatarPreco(
      p.preco ?? p.preço ?? p["Preço (€)"]
    );

    linha.append(descricao,preco);
    caixa.appendChild(linha);
  });

  if(!caixa.children.length){
    caixa.textContent="Sem produtos disponíveis";
  }

  // RODAPÉ
  let mensagens=[];

  if(Array.isArray(dados.rodape)){
    mensagens=dados.rodape
      .filter(item=>ativo(item.ativo ?? item.Ativo ?? "SIM"))
      .sort((a,b)=>Number(a.ordem ?? a.Ordem ?? 0)
                  -Number(b.ordem ?? b.Ordem ?? 0))
      .map(item=>texto(
        item.texto ?? item["Texto do rodapé"] ?? item.mensagem
      ))
      .filter(Boolean);
  }else if(typeof dados.rodape==="string"){
    mensagens=[dados.rodape];
  }

  const rodape=document.getElementById("rodape");
  rodape.textContent=mensagens.length
    ? mensagens.join("     •     ")
    : "Bem-vindo à AUTHÊNTICA";
}

let carregamento=0;

function atualizar(){
  const callback="nexaReceber"+(++carregamento);
  const script=document.createElement("script");

  window[callback]=function(dados){
    receber(dados);
    delete window[callback];
    script.remove();
  };

  script.src=API+"?callback="+callback+"&t="+Date.now();
  script.onerror=function(){
    console.error("Erro ao carregar dados do Google Sheets");
    delete window[callback];
    script.remove();
  };

  document.body.appendChild(script);
}

atualizar();
setInterval(atualizar,60000);
</script>
</body>
</html>
